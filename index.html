<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rotinas">
  <title>Painel de rotinas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="clock-heading">
        <time id="current-time" class="current-time">--:--</time>
        <time id="current-date" class="current-date"></time>
      </div>
      <div class="status-heading">
        <span id="weather" class="weather" hidden></span>
        <span id="weather-location" class="weather-location" hidden></span>
        <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" hidden>🔊 Ativar som</button>
      </div>
    </header>

    <main class="current-task" aria-live="polite">
      <span id="phase-indicator" class="phase-indicator" hidden></span>
      <div id="task-icon" class="task-icon" aria-hidden="true">☀️</div>
      <h1 id="task-name">A CARREGAR</h1>
      <p id="counter-label" class="counter-label">TEMPO RESTANTE</p>
      <div id="countdown" class="countdown">--:--</div>
      <p id="phase-next-label" class="phase-next-label" hidden>Próximo</p>
      <div id="phase-next" class="phase-next" hidden></div>
    </main>

    <nav class="phase-path" aria-label="Etapas da fase">
      <ol id="timeline" class="timeline"></ol>
    </nav>
  </div>
</body>
</html>
